<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1010" width="1280" height="1010" font-family="Arial, Helvetica, sans-serif">
  <title>Expedia Lite, Part 1 mockup: ZIP search with a synchronized hotel list and map</title>
  <desc>Wireframe drawn on 2026-09-29 before any list or map code was written. The main screen shows the ZIP form, a summary line, a hotel list beside a map, with the same hotel selected in both. Below are the six states the interface must tell apart.</desc>

  <rect width="1280" height="1010" fill="#f6f7fb"/>

  <text x="30" y="34" font-size="22" font-weight="700" fill="#191e3b">Expedia Lite, Part 1: live hotel search and map (early mockup)</text>
  <text x="30" y="54" font-size="13" fill="#5a6079">Wireframe. Hotel names are placeholders. Only fields the provider returns appear: name, address, distance, website. No prices, ratings, or availability.</text>

  <!-- Main screen frame -->
  <rect x="30" y="70" width="1220" height="560" rx="14" fill="#ffffff" stroke="#c9cee0" stroke-width="2"/>

  <!-- 1. ZIP form -->
  <text x="54" y="104" font-size="12" font-weight="700" fill="#5a6079" letter-spacing="1.4">LOCATION DATA</text>
  <text x="54" y="130" font-size="20" font-weight="700" fill="#191e3b">Where are you headed?</text>
  <rect x="54" y="144" width="130" height="46" rx="10" fill="#fff" stroke="#9aa3bd" stroke-width="1.5"/>
  <text x="66" y="160" font-size="10" fill="#5a6079">ZIP code</text>
  <text x="66" y="180" font-size="16" fill="#191e3b" letter-spacing="1.5">16802</text>
  <rect x="198" y="144" width="150" height="46" rx="23" fill="#191e3b"/>
  <text x="273" y="173" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Find hotels</text>
  <text x="366" y="173" font-size="12" fill="#5a6079">Five digits, including any leading zeros.</text>

  <!-- 2. Summary line -->
  <rect x="54" y="204" width="1172" height="34" rx="8" fill="#eef3fe"/>
  <text x="66" y="226" font-size="13" fill="#191e3b">Hotels within 5 km of State College, PA 16802 (centre 40.8032, -77.8614). Showing the nearest 20; there may be more.</text>

  <!-- 3. List column -->
  <g>
    <rect x="54" y="252" width="420" height="356" rx="10" fill="#fafbfe" stroke="#e1e5f0"/>

    <!-- selected card -->
    <rect x="62" y="260" width="404" height="82" rx="10" fill="#fff" stroke="#1668e3" stroke-width="3"/>
    <circle cx="90" cy="301" r="15" fill="#1668e3"/>
    <text x="90" y="306" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="118" y="286" font-size="15" font-weight="700" fill="#191e3b">Example Hotel One</text>
    <text x="118" y="306" font-size="12" fill="#5a6079">205 East Beaver Avenue, State College, PA</text>
    <text x="118" y="326" font-size="12" fill="#5a6079">968 m from the centre   ·   <tspan fill="#1668e3" text-decoration="underline">Website</tspan></text>

    <rect x="62" y="350" width="404" height="76" rx="10" fill="#fff" stroke="#e1e5f0"/>
    <circle cx="90" cy="388" r="15" fill="#5a6079"/>
    <text x="90" y="393" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="118" y="376" font-size="15" font-weight="700" fill="#191e3b">Example Hotel Two</text>
    <text x="118" y="396" font-size="12" fill="#5a6079">100 West College Avenue, State College, PA</text>
    <text x="118" y="414" font-size="12" fill="#5a6079">997 m from the centre</text>

    <rect x="62" y="434" width="404" height="76" rx="10" fill="#fff" stroke="#e1e5f0"/>
    <circle cx="90" cy="472" r="15" fill="#5a6079"/>
    <text x="90" y="477" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="118" y="460" font-size="15" font-weight="700" fill="#191e3b">Name not provided</text>
    <text x="118" y="480" font-size="12" fill="#5a6079">Address not provided</text>
    <text x="118" y="498" font-size="12" fill="#5a6079">1,056 m from the centre</text>

    <rect x="62" y="518" width="404" height="82" rx="10" fill="#fff" stroke="#e1e5f0"/>
    <circle cx="90" cy="559" r="15" fill="#5a6079"/>
    <text x="90" y="564" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="118" y="544" font-size="15" font-weight="700" fill="#191e3b">Example Hotel Four</text>
    <text x="118" y="564" font-size="12" fill="#5a6079">219 West Beaver Avenue, State College, PA</text>
    <text x="118" y="584" font-size="12" fill="#5a6079">1,199 m from the centre</text>
  </g>

  <!-- 4. Map -->
  <g>
    <rect x="490" y="252" width="736" height="356" rx="10" fill="#dfeadf" stroke="#b9c8b9"/>
    <path d="M490 470 C620 430 720 500 860 440 S1100 380 1226 420" fill="none" stroke="#f3f6f1" stroke-width="10"/>
    <path d="M700 252 C720 340 690 430 740 608" fill="none" stroke="#f3f6f1" stroke-width="8"/>
    <circle cx="858" cy="430" r="160" fill="none" stroke="#1668e3" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="858" y="282" font-size="11" fill="#1668e3" text-anchor="middle">5 km search radius</text>

    <!-- centre marker -->
    <path d="M858 412 L874 430 L858 448 L842 430 Z" fill="#191e3b" stroke="#fff" stroke-width="2"/>
    <text x="858" y="470" font-size="11" fill="#191e3b" text-anchor="middle">ZIP 16802 centre</text>

    <!-- pins -->
    <circle cx="820" cy="470" r="17" fill="#1668e3" stroke="#fff" stroke-width="3"/>
    <text x="820" y="476" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <circle cx="905" cy="398" r="13" fill="#5a6079" stroke="#fff" stroke-width="2"/>
    <text x="905" y="403" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <circle cx="770" cy="380" r="13" fill="#5a6079" stroke="#fff" stroke-width="2"/>
    <text x="770" y="385" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <circle cx="950" cy="500" r="13" fill="#5a6079" stroke="#fff" stroke-width="2"/>
    <text x="950" y="505" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>

    <!-- popup for the selected pin -->
    <rect x="712" y="500" width="150" height="34" rx="6" fill="#fff" stroke="#1668e3"/>
    <text x="787" y="521" font-size="12" font-weight="700" fill="#191e3b" text-anchor="middle">Example Hotel One</text>

    <!-- zoom buttons and attribution -->
    <rect x="1186" y="264" width="30" height="60" rx="6" fill="#fff" stroke="#9aa3bd"/>
    <text x="1201" y="286" font-size="18" fill="#191e3b" text-anchor="middle">+</text>
    <text x="1201" y="312" font-size="18" fill="#191e3b" text-anchor="middle">-</text>
    <rect x="1042" y="586" width="180" height="18" rx="3" fill="#ffffffcc"/>
    <text x="1132" y="599" font-size="11" fill="#191e3b" text-anchor="middle">© OpenStreetMap contributors</text>
  </g>

  <!-- annotation markers -->
  <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="40" cy="120" r="13" fill="#c2410c"/><text x="40" y="125">1</text>
    <circle cx="40" cy="221" r="13" fill="#c2410c"/><text x="40" y="226">2</text>
    <circle cx="40" cy="330" r="13" fill="#c2410c"/><text x="40" y="335">3</text>
    <circle cx="1238" cy="330" r="13" fill="#c2410c"/><text x="1238" y="335">4</text>
    <circle cx="1238" cy="440" r="13" fill="#c2410c"/><text x="1238" y="445">5</text>
    <circle cx="1238" cy="593" r="13" fill="#c2410c"/><text x="1238" y="598">6</text>
  </g>

  <!-- legend -->
  <g font-size="12.5" fill="#191e3b">
    <text x="30" y="654"><tspan font-weight="700" fill="#c2410c">1</tspan> ZIP box: submits on Enter, five digits only, checked in the browser before any request.</text>
    <text x="30" y="672"><tspan font-weight="700" fill="#c2410c">2</tspan> Summary: states the centre, the 5 km radius, and that a full page of 20 may not be every hotel.</text>
    <text x="30" y="690"><tspan font-weight="700" fill="#c2410c">3</tspan> List: each card is a real button. Numbered to match the map. Missing fields say so or are left out.</text>
    <text x="640" y="654"><tspan font-weight="700" fill="#c2410c">4</tspan> Map: numbered pins take keyboard focus and activate on Enter. The centre is a separate diamond.</text>
    <text x="640" y="672"><tspan font-weight="700" fill="#c2410c">5</tspan> Selecting in the list or on the map highlights the same hotel in both, and recentres the map.</text>
    <text x="640" y="690"><tspan font-weight="700" fill="#c2410c">6</tspan> Attribution always visible. Tiles need no key, so no credential reaches the browser.</text>
  </g>

  <!-- State strip -->
  <text x="30" y="724" font-size="16" font-weight="700" fill="#191e3b">States the screen must tell apart</text>

  <g font-size="12" fill="#191e3b">
    <!-- loading -->
    <rect x="30" y="736" width="196" height="150" rx="10" fill="#fff" stroke="#c9cee0"/>
    <text x="42" y="758" font-weight="700">A. Loading</text>
    <rect x="42" y="770" width="172" height="26" rx="5" fill="#e6e9f2"/>
    <rect x="42" y="802" width="172" height="26" rx="5" fill="#e6e9f2"/>
    <text x="42" y="850" fill="#5a6079">Grey placeholders and</text>
    <text x="42" y="866" fill="#5a6079">"Finding hotels..." Button</text>
    <text x="42" y="882" fill="#5a6079">disabled. Not "no results".</text>

    <!-- invalid -->
    <rect x="240" y="736" width="196" height="150" rx="10" fill="#fff" stroke="#c9cee0"/>
    <text x="252" y="758" font-weight="700">B. Invalid input</text>
    <rect x="252" y="770" width="70" height="28" rx="6" fill="#fff" stroke="#b3261e" stroke-width="2"/>
    <text x="262" y="789" fill="#191e3b">123</text>
    <text x="252" y="820" fill="#b3261e" font-weight="700">A ZIP code is five digits,</text>
    <text x="252" y="836" fill="#b3261e" font-weight="700">for example 16802.</text>
    <text x="252" y="866" fill="#5a6079">Blocked in the browser.</text>
    <text x="252" y="882" fill="#5a6079">No request is made.</text>

    <!-- unresolved -->
    <rect x="450" y="736" width="196" height="150" rx="10" fill="#fff" stroke="#c9cee0"/>
    <text x="462" y="758" font-weight="700">C. ZIP not resolved</text>
    <rect x="462" y="770" width="172" height="50" rx="6" fill="#fbeceb"/>
    <text x="470" y="790" fill="#8a1f18" font-weight="700">No United States location</text>
    <text x="470" y="806" fill="#8a1f18" font-weight="700">found for ZIP 00000.</text>
    <text x="462" y="850" fill="#5a6079">No hotels are searched.</text>
    <text x="462" y="866" fill="#5a6079">Never a search somewhere</text>
    <text x="462" y="882" fill="#5a6079">else.</text>

    <!-- no nearby -->
    <rect x="660" y="736" width="196" height="150" rx="10" fill="#fff" stroke="#c9cee0"/>
    <text x="672" y="758" font-weight="700">D. No nearby hotels</text>
    <rect x="672" y="770" width="172" height="50" rx="6" fill="#fff8e1"/>
    <text x="680" y="790" fill="#6b5313" font-weight="700">No hotels found within</text>
    <text x="680" y="806" fill="#6b5313" font-weight="700">5 km of this ZIP.</text>
    <text x="672" y="850" fill="#5a6079">A successful search. The</text>
    <text x="672" y="866" fill="#5a6079">centre still shows on the</text>
    <text x="672" y="882" fill="#5a6079">map. Try another ZIP.</text>

    <!-- rate limited -->
    <rect x="870" y="736" width="196" height="150" rx="10" fill="#fff" stroke="#c9cee0"/>
    <text x="882" y="758" font-weight="700">E. Rate limited</text>
    <rect x="882" y="770" width="172" height="50" rx="6" fill="#fbeceb"/>
    <text x="890" y="790" fill="#8a1f18" font-weight="700">The location service has</text>
    <text x="890" y="806" fill="#8a1f18" font-weight="700">reached its request limit.</text>
    <text x="882" y="850" fill="#5a6079">Says to try again later.</text>
    <text x="882" y="866" fill="#5a6079">An error, not an empty</text>
    <text x="882" y="882" fill="#5a6079">list.</text>

    <!-- failed -->
    <rect x="1080" y="736" width="170" height="150" rx="10" fill="#fff" stroke="#c9cee0"/>
    <text x="1092" y="758" font-weight="700">F. Request failed</text>
    <rect x="1092" y="770" width="146" height="62" rx="6" fill="#fbeceb"/>
    <text x="1100" y="790" fill="#8a1f18" font-weight="700">The location service</text>
    <text x="1100" y="806" fill="#8a1f18" font-weight="700">could not be reached.</text>
    <text x="1092" y="854" fill="#5a6079">Never shown as</text>
    <text x="1092" y="870" fill="#5a6079">"0 hotels".</text>
  </g>

  <!-- Narrow screen note -->
  <rect x="30" y="900" width="1220" height="90" rx="10" fill="#fff" stroke="#c9cee0"/>
  <text x="46" y="924" font-size="14" font-weight="700" fill="#191e3b">Narrow screens</text>
  <text x="46" y="946" font-size="12.5" fill="#191e3b">The list and the map stack instead of sitting side by side, map first, so both are still on the page and selection still highlights both.</text>
  <text x="46" y="966" font-size="12.5" fill="#191e3b">Existing behaviour is unchanged: the hotel-name search, booking, and booking history stay above this section.</text>
  <text x="46" y="984" font-size="12" fill="#5a6079">Colours: blue marks the selected hotel and the search radius; dark grey marks other hotels; the dark diamond is the search centre.</text>
</svg>
